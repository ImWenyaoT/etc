name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    strategy:
      fail-fast: false
      matrix:
        project: [nodejs-cli-file-search, json-yaml-xml-parser, random-red-black-tree-sort, web-front-end-snake-game, trumpet-twitter]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.project }}/go.mod
          cache: ${{ matrix.project == 'json-yaml-xml-parser' || matrix.project == 'trumpet-twitter' }}
          cache-dependency-path: ${{ matrix.project }}/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/web/package-lock.json
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - run: npm ci
        working-directory: ${{ matrix.project }}/web
      - run: npm test
        working-directory: ${{ matrix.project }}/web
      - run: npm run build
        working-directory: ${{ matrix.project }}/web
