packages:
  - 'apps/*'
  - 'packages/*'

# Native dependencies allowed to run install/build scripts.
# Replaces the deprecated package.json "pnpm.onlyBuiltDependencies" field.
allowBuilds:
  better-sqlite3: true
  esbuild: true

minimumReleaseAgeExclude:
  - '@types/node@24.19.0'

# jsdom@30 / @asamuzakjp/css-color want ^4.0.1; default resolution can stick on 4.0.0.
overrides:
  '@csstools/css-parser-algorithms': '^4.0.1'
